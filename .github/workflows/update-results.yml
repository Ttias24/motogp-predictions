# Hämtar nya resultat från MotoGP:s API och publicerar sidan på GitHub Pages.
# Körs automatiskt söndagar, måndagar och torsdagar, 1 januari (säsongsbyte), vid varje push
# och manuellt via "Run workflow" under fliken Actions.
name: Uppdatera resultat och publicera

on:
  schedule:
    - cron: "20 */3 * * 0,1,4" # var 3:e timme sön, mån och tors (UTC)
    - cron: "5 0 1 1 *" # 1 januari: ny säsong, förra året flyttas till Historik
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Säsongsbyte (bara när ett nytt år har börjat)
        if: github.event_name != 'push'
        run: node scripts/rollover.mjs
      - name: Hämta resultat
        if: github.event_name != 'push'
        run: node scripts/fetch-results.mjs
      - name: Hämta nästa säsongs startlista (om MotoGP publicerat den)
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/fetch-results.mjs --year $(( $(node -p "require('./data/seasons.json').current") + 1 ))
      - name: Synka tipsperioden till databasen
        # Öppnar när startlistan publicerats, stänger 23:59 dagen före första tävlingshelgen.
        # Datum som admin ändrat för hand lämnas orörda.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SUPABASE_SYNC_KEY: ${{ secrets.SUPABASE_SYNC_KEY }}
        run: node scripts/sync-season.mjs
      - name: Säkerhetskopiera tips från databasen
        # Sparar tipsen i data/picks-<år>.json när tipsperioden har stängt (då är de publika).
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/backup-picks.mjs
      - name: Kontrollera poängmotorn
        run: node scripts/check-scores.mjs
      - name: Spara ändringar
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Nya resultat $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash
            git push
          else
            echo "Inga ändringar."
          fi
      - name: Håll schemat aktivt
        # GitHub pausar schemalagda körningar efter 60 dagar utan aktivitet (t.ex. över vintern).
        # Att "aktivera" arbetsflödet nollställer den räknaren.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-results.yml/enable"
      - name: Håll databasen vaken
        # Supabase gratisprojekt pausas efter en vecka utan anrop. En liten läsning räcker.
        # Adress och nyckel är de publika värdena från js/config.js.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          URL=$(sed -n 's/^export const SUPABASE_URL = "\(.*\)";/\1/p' js/config.js)
          KEY=$(sed -n 's/^export const SUPABASE_ANON_KEY = "\(.*\)";/\1/p' js/config.js)
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            curl -sf -X POST "$URL/rest/v1/rpc/season_overview" -H "apikey: $KEY" -H "content-type: application/json" -d '{"p_year": 2000}' -o /dev/null && echo "Databasen svarar."
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
