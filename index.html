    <!--
      Säkerhetsregler (Content Security Policy): skript får bara komma från sidan själv,
      data får bara skickas till sidan och till databasen (Supabase). Även om en bugg eller
      ett främmande skript skulle ta sig in kan det inte köra inbäddad kod eller skicka data någon annanstans.
      Inline-stilar (style="…") behövs för färgerna och är ofarliga.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self' https://rmxviwxiyfawkflhqaey.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: https://photos.motogp.com https://cdn.jsdelivr.net; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
